<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patient Portal - Sticky Notes</title>

  <!-- Firebase SDKs for Instant Cross-PC Sync -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
      --panel-bg: rgba(255, 255, 255, 0.05);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --input-bg: rgba(255, 255, 255, 0.07);
      --error-color: #f43f5e;
    }

    [data-theme="light-glass"] {
      --bg-gradient: linear-gradient(135deg, #e0e7ff, #fae8ff, #fce7f3);
      --panel-bg: rgba(255, 255, 255, 0.55);
      --panel-border: rgba(255, 255, 255, 0.7);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent: #4f46e5;
      --accent-glow: rgba(79, 70, 229, 0.25);
      --input-bg: rgba(255, 255, 255, 0.6);
    }

    [data-theme="neon-aurora"] {
      --bg-gradient: linear-gradient(135deg, #030712, #064e3b, #022c22);
      --panel-bg: rgba(16, 185, 129, 0.08);
      --panel-border: rgba(52, 211, 153, 0.25);
      --text-main: #ecfdf5;
      --text-muted: #6ee7b7;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --input-bg: rgba(6, 78, 59, 0.3);
    }

    [data-theme="cyberpunk"] {
      --bg-gradient: linear-gradient(135deg, #180828, #2a0845, #4a0040);
      --panel-bg: rgba(236, 72, 153, 0.1);
      --panel-border: rgba(244, 114, 182, 0.35);
      --text-main: #fdf2f8;
      --text-muted: #f472b6;
      --accent: #f43f5e;
      --accent-glow: rgba(244, 63, 94, 0.5);
      --input-bg: rgba(88, 28, 135, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .glass-container {
      width: 100%;
      max-width: 800px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .theme-selector select {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 10px 16px;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
    }

    .theme-selector select option {
      background: #1e1b4b;
      color: #ffffff;
    }

    /* Tabs UI */
    .nav-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 12px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab-btn.active {
      color: var(--text-main);
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .form-group { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      color: var(--text-main);
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    input[readonly] { opacity: 0.7; cursor: not-allowed; }

    .dob-group {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    textarea { resize: vertical; min-height: 100px; }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .records-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-height: 450px;
      overflow-y: auto;
    }

    .record-card {
      background: var(--input-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 16px;
    }

    .record-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .record-id { color: var(--accent); font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="glass-container">
    <header>
      <div>
        <h1>Medical Center Portal</h1>
        <p style="font-size: 0.8rem; color: var(--text-muted)">Live Synchronized Patient Records</p>
      </div>
      <div class="theme-selector">
        <select id="themeSelect">
          <option value="dark-glass">Dark Glass</option>
          <option value="light-glass">Light Glass</option>
          <option value="neon-aurora">Neon Aurora</option>
          <option value="cyberpunk">Cyberpunk</option>
        </select>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('add')">Add Patient Note</button>
      <button class="tab-btn" onclick="switchTab('view')">View Records</button>
    </div>

    <!-- Tab 1: Add Note -->
    <div id="addTab" class="tab-content active">
      <form id="patientForm">
        <div class="form-group">
          <label>Patient ID</label>
          <input type="text" id="patientId" readonly />
        </div>

        <div class="form-group">
          <label>Patient Name</label>
          <input type="text" id="patientName" placeholder="e.g. Jane Doe" required />
        </div>

        <div class="form-group">
          <label>Date of Birth</label>
          <div class="dob-group">
            <input type="number" id="dobMonth" placeholder="MM" min="1" max="12" required />
            <input type="number" id="dobDay" placeholder="DD" min="1" max="31" required />
            <input type="number" id="dobYear" placeholder="YYYY" min="1900" max="2026" required />
          </div>
        </div>

        <div class="form-group">
          <label>Clinical Notes</label>
          <textarea id="patientNotes" placeholder="Enter diagnosis or notes..." required></textarea>
        </div>

        <button type="submit" class="btn">Save & Sync Record</button>
      </form>
    </div>

    <!-- Tab 2: View Notes -->
    <div id="viewTab" class="tab-content">
      <div class="records-grid" id="recordsGrid"></div>
    </div>
  </div>

  <script>
    // Theme Engine
    const themeSelect = document.getElementById('themeSelect');
    function applyTheme(theme) {
      if (theme === 'dark-glass') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('selectedTheme', theme);
    }
    themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));
    const savedTheme = localStorage.getItem('selectedTheme') || 'dark-glass';
    themeSelect.value = savedTheme;
    applyTheme(savedTheme);

    // Tab Switcher
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (tab === 'add') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('addTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('viewTab').classList.add('active');
      }
    }

    // Direct Firebase Database Initialization
    const firebaseConfig = { databaseURL: "https://public-sync-notes-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('patient_notes');

    // Smart Auto-filling ID
    const patientIdInput = document.getElementById('patientId');
    let nextId = 101;
    patientIdInput.value = `P-${nextId}`;

    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const recordsGrid = document.getElementById('recordsGrid');
      recordsGrid.innerHTML = '';

      if (data) {
        const records = Object.values(data);
        
        // Compute Next Sequential ID
        let highest = 100;
        records.forEach(r => {
          const num = parseInt(r.patientId.replace('P-', ''), 10);
          if (!isNaN(num) && num > highest) highest = num;
        });
        nextId = highest + 1;
        patientIdInput.value = `P-${nextId}`;

        // Render Cards (Newest First)
        records.sort((a, b) => b.timestamp - a.timestamp).forEach(r => {
          const card = document.createElement('div');
          card.className = 'record-card';
          card.innerHTML = `
            <div class="record-header">
              <span>${escapeHtml(r.name)}</span>
              <span class="record-id">${escapeHtml(r.patientId)}</span>
            </div>
            <div style="font-size:0.8rem; color: var(--text-muted); margin-bottom: 8px;">DOB: ${escapeHtml(r.dob)}</div>
            <div style="font-size:0.9rem; white-space: pre-wrap;">${escapeHtml(r.notes)}</div>
          `;
          recordsGrid.appendChild(card);
        });
      } else {
        patientIdInput.value = 'P-101';
        recordsGrid.innerHTML = '<p style="color:var(--text-muted)">No records found.</p>';
      }
    });

    // Form Submit (Enter-Key Friendly)
    document.getElementById('patientForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const name = document.getElementById('patientName').value.trim();
      const month = document.getElementById('dobMonth').value.trim().padStart(2, '0');
      const day = document.getElementById('dobDay').value.trim().padStart(2, '0');
      const year = document.getElementById('dobYear').value.trim();
      const notes = document.getElementById('patientNotes').value.trim();

      dbRef.push({
        patientId: patientIdInput.value,
        name,
        dob: `${month}/${day}/${year}`,
        notes,
        timestamp: Date.now()
      });

      document.getElementById('patientForm').reset();
      patientIdInput.value = `P-${nextId}`;
      switchTab('view');
    });

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]);
    }
  </script>
</body>
</html>
