<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Notes App</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-light: #6b7280;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Tabs UI */
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: #e5e7eb;
    }

    .tab-btn.active {
      color: var(--primary);
      background: #eff6ff;
    }

    /* Tab Content Views */
    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form Styles */
    .form-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    button.submit-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }

    button.submit-btn:hover {
      background: var(--primary-hover);
    }

    /* Grid Styles */
    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .note-card {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border-top: 4px solid var(--primary);
    }

    .note-card h3 {
      margin-bottom: 0.5rem;
      font-size: 1.25rem;
    }

    .note-card p {
      color: var(--text-light);
      font-size: 0.95rem;
      white-space: pre-wrap;
      margin-bottom: 1rem;
    }

    .note-date {
      font-size: 0.8rem;
      color: #9ca3af;
      text-align: right;
    }

    #loadingMsg {
      text-align: center;
      color: var(--text-light);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Sticky Notes</h1>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('add')">Add Note</button>
      <button class="tab-btn" onclick="switchTab('view')">View Notes</button>
    </div>

    <!-- Add Note Tab -->
    <div id="addTab" class="tab-content active">
      <div class="form-card">
        <form id="noteForm">
          <div class="form-group">
            <label for="title">Note Title</label>
            <input type="text" id="title" placeholder="Enter title..." required>
          </div>
          <div class="form-group">
            <label for="content">Note Content</label>
            <textarea id="content" placeholder="Type your note here..." required></textarea>
          </div>
          <button type="submit" class="submit-btn">Save Note</button>
        </form>
      </div>
    </div>

    <!-- View Notes Tab -->
    <div id="viewTab" class="tab-content">
      <div id="loadingMsg">Loading notes...</div>
      <div class="notes-grid" id="notesGrid"></div>
    </div>
  </div>

  <script>
    // Point this to your Render backend URL
    const API_URL = 'https://sticky-notes-back-end.onrender.com/api/notes';

    // Tab Switching Logic
    function switchTab(tabName) {
      // Update Buttons
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      // Update Content Views
      document.getElementById('addTab').classList.remove('active');
      document.getElementById('viewTab').classList.remove('active');
      
      if (tabName === 'add') {
        document.getElementById('addTab').classList.add('active');
      } else {
        document.getElementById('viewTab').classList.add('active');
        fetchNotes(); // Auto-refresh notes when switching to the View tab
      }
    }

    // Submit New Note
    document.getElementById('noteForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.querySelector('.submit-btn');
      submitBtn.innerText = 'Saving...';
      submitBtn.disabled = true;

      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, content })
        });

        if (response.ok) {
          // Reset form and switch to view tab
          document.getElementById('noteForm').reset();
          switchTab('view');
          
          // Manually update tab UI states since we called switchTab programmatically
          document.querySelectorAll('.tab-btn')[0].classList.remove('active');
          document.querySelectorAll('.tab-btn')[1].classList.add('active');
        } else {
          alert('Failed to save note.');
        }
      } catch (error) {
        console.error('Error saving note:', error);
        alert('Could not connect to the server. Is your Render instance awake?');
      } finally {
        submitBtn.innerText = 'Save Note';
        submitBtn.disabled = false;
      }
    });

    // Fetch and Display Notes
    async function fetchNotes() {
      const grid = document.getElementById('notesGrid');
      const loading = document.getElementById('loadingMsg');
      
      grid.innerHTML = '';
      loading.style.display = 'block';

      try {
        const response = await fetch(API_URL);
        const notes = await response.json();
        
        loading.style.display = 'none';

        if (notes.length === 0) {
          grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #6b7280;">No notes found. Go add one!</p>';
          return;
        }

        notes.forEach(note => {
          const card = document.createElement('div');
          card.className = 'note-card';
          card.innerHTML = `
            <h3>${escapeHTML(note.title)}</h3>
            <p>${escapeHTML(note.content)}</p>
            <div class="note-date">${note.timestamp}</div>
          `;
          grid.appendChild(card);
        });
      } catch (error) {
        console.error('Error fetching notes:', error);
        loading.innerHTML = 'Failed to load notes. Please check your backend connection.';
      }
    }

    // Utility to prevent XSS attacks when displaying data
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.innerText = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
